name: Build Dogmos release

permissions:
  id-token: write
  attestations: write
  contents: write

on:
  release:
    types: [published]

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            binary: libdogmos.so
          - os: windows-latest
            target: i686-pc-windows-msvc
            binary: dogmos.dll
            symbols: dogmos.pdb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Install 32-bit linker support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-multilib

      - name: Build Dogmos
        run: cargo build --locked --target ${{ matrix.target }} --release

      - name: Generate Dogmos bindings
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --target ${{ matrix.target }} --release --lib generate_binds -- --exact --show-output
          mv bindings.dm dogmos_bindings.dm

      - name: Attest binary
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Attest Windows symbols
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/${{ matrix.symbols }}

      - name: Attest Dogmos bindings
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dogmos_bindings.dm

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "target/${{ matrix.target }}/release/${{ matrix.binary }}" --clobber

      - name: Upload Windows symbols to release
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "target/${{ matrix.target }}/release/${{ matrix.symbols }}" --clobber

      - name: Upload Dogmos bindings to release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dogmos_bindings.dm --clobber
