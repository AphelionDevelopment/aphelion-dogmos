name: Publish Dogmos release contract

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Download verified paired release contract
        uses: actions/download-artifact@v8
        with:
          name: dogmos-release-contract
          path: ${{ runner.temp }}/dogmos-release-bundle

      - name: Reverify release contract before publication
        run: >-
          python tools/dogmos_contract.py verify
          --manifest "${RUNNER_TEMP}/dogmos-release-bundle/dogmos-release-manifest.json"
          --bundle-root "${RUNNER_TEMP}/dogmos-release-bundle"

      - name: Attest paired release contract
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/dogmos-release-bundle/**

      - name: Upload paired contract to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="${RUNNER_TEMP}/dogmos-release-bundle"
          gh release upload "${{ github.event.release.tag_name }}" \
            "${root}/dogmos-release-manifest.json" \
            "${root}/dogmos_bindings.dm" \
            "${root}/windows/dogmos.dll" \
            "${root}/windows/dogmos.pdb" \
            "${root}/windows/dogmosd.exe" \
            "${root}/windows/dogmosd.pdb" \
            "${root}/linux/libdogmos.so" \
            "${root}/linux/libdogmos.so.debug" \
            "${root}/linux/dogmosd" \
            "${root}/linux/dogmosd.debug" \
            --clobber
