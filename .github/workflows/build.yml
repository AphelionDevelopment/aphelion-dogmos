name: Build Dogmos for Linux

on:
  push:
    branches: [dogmos, master]

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: i686-unknown-linux-gnu

      - name: Install 32-bit linker support
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-multilib

      - name: Check supported feature matrix
        shell: pwsh
        run: tools/check_feature_matrix.ps1 -Target i686-unknown-linux-gnu

      - name: Build Dogmos
        run: cargo build --workspace --locked --target i686-unknown-linux-gnu --release
