[workspace]
members = ["crates/*"]

[workspace.dependencies]
# BYOND changed the byondapi ABI at 516.1682, which crates.io does not carry - the newest published
# release (0.5.14, Mar 2025) predates the "Migrate to 516.1682" merge (Jun 2026). Reading a DM var by
# string id against a 515-era ABI access-violates BYOND rather than failing cleanly, so this must
# track git until a release ships with 516 support.
byondapi = { git = "https://github.com/spacestation13/byondapi-rs", branch = "main" }
coarsetime = "0.1.35"
flume = "0.11.1"
eyre = "0.6.12"
tracing = "0.1.41"

[package]
name = "dogmos"
version = "2.3.0"
authors = ["Putnam <putnam3145@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["turf_processing", "katmos", "superconductivity", "katmos_slow_decompression"]
zas_hooks = []
turf_processing = []
superconductivity = ["turf_processing"]
fastmos = ["turf_processing"]
katmos = ["fastmos"]
katmos_slow_decompression = ["fastmos"]
reaction_hooks = []
citadel_reactions = ["reaction_hooks"]
yogs_reactions = ["reaction_hooks"]

# Tracing will expose this application to a local port, use with care
tracy = ["dep:tracing-tracy", "dep:tracing-subscriber", "dep:tracing"]

[lib]
crate-type = ["cdylib"]

[dependencies]
byondapi = { workspace = true }
flume = { workspace = true }
coarsetime = { workspace = true }
eyre = { workspace = true }
auxcallback = { path = "./crates/auxcallback" }
auxmacros = { path = "./crates/auxmacros" }
itertools = "0.14.0"
rayon = "1.10.0"
float-ord = "0.3.2"
parking_lot = "0.12.3"
rustc-hash = "2.1.0"
ahash = "0.8.11"
indexmap = { version = "2.5.0", features = ["rayon"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
hashbrown = "0.15.2"
atomic_float = "1.1.0"
petgraph = "0.7.0"
bitflags = "2.6.0"
nom = "7.1.3"
mimalloc = { version = "0.1.43", default-features = false }

tracing = { version = "0.1.41", optional = true }
tracing-tracy = { version = "0.11.4", optional = true }
tracing-subscriber = { version = "0.3.19", optional = true }

[dependencies.tinyvec]
version = "1.8.1"
features = ["rustc_1_61", "alloc"]

[profile.release]
lto = 'fat'
debug = true
codegen-units = 1
# Meridian: was 'abort' until 2026-08-13. rayon's worker threads (spawned for turf heat processing,
# see turfs/superconduct.rs) wrap their closures in stdlib machinery that expects to be able to
# unwind. Under panic = 'abort' any panic on one of those threads - even one that would otherwise be
# harmless and locally recoverable - hits that wrapper's nounwind boundary and the whole process
# aborts via core::panicking::panic_cannot_unwind, which prints only "panic in a function that cannot
# unwind" with the real message and location discarded. This reproduced on every optimization level
# (release, and a no-LTO/16-codegen-unit variant) but never under a debug build (panic = 'unwind' by
# default there) - confirmed by bisecting on the panic strategy alone with LTO otherwise unchanged.
# 'unwind' costs unwind-table size and a little codegen headroom; that's a better trade than a
# DreamDaemon that dies silently and unrecoverably the first time gas or turf setup panics on a
# worker thread.
panic = 'unwind'
